<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>WireGuard JS - Local Preview</title>
  <style>
    body{margin:0;background:#f4f6f7;color:#252b2d;font:14px/1.5 system-ui,sans-serif;letter-spacing:0}
    main{max-width:1100px;padding:24px;margin:auto;background:#fff;min-height:100vh}
    .functions-container{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #dde3e5;padding:0 0 16px}
    .functions-container strong{font-size:16px}.preview-label{color:#667579;font-size:12px}
    .toasts{position:fixed;bottom:16px;right:16px;max-width:min(380px,calc(100vw - 32px));z-index:1000}
    .toast{background:#252b2d;color:white;padding:12px 16px;border-radius:6px;margin-top:8px;white-space:pre-wrap;overflow-wrap:anywhere}
    @media(max-width:680px){main{padding:12px}.functions-container{gap:10px}}
  </style>
</head>
<body>
  <main><div class="functions-container"><strong>设备管理</strong><span class="preview-label">本地模拟设备</span></div></main>
  <div class="toasts" aria-live="polite"></div>
  <script src="tests/preview-host.js"></script>
  <script src="wireguard.js"></script>
</body>
</html>
